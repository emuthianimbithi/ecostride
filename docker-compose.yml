version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecostride
      POSTGRES_PASSWORD: ecostride
      POSTGRES_DB: ecostride
    ports:
      - "5432:5432"
    volumes:
      - ecostride_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ecostride_redis:/data

volumes:
  ecostride_pg:
  ecostride_redis:

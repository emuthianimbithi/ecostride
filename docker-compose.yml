services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecostride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecostride}
      POSTGRES_DB: ${POSTGRES_DB:-ecostride}
    volumes:
      - ecostride_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecostride}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - ecostride_redis:/data

  migrate:
    build:
      context: ./backend
    command: ["/app/migrate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      MEDIA_DIR: /app/uploads
    volumes:
      - ecostride_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE: http://backend:8080/api/v1
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  ecostride_pg:
  ecostride_redis:
  ecostride_uploads:

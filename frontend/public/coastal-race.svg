<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="600" y1="0" x2="600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4D9C6"/>
      <stop offset="55%" stop-color="#F1EADD"/>
      <stop offset="100%" stop-color="#FAF0E2"/>
    </linearGradient>
    <linearGradient id="deepWater" x1="600" y1="660" x2="600" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6390"/>
      <stop offset="100%" stop-color="#3D78A8"/>
    </linearGradient>
    <linearGradient id="shallowWater" x1="600" y1="850" x2="600" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7BA7CA"/>
      <stop offset="65%" stop-color="#A1C9DE"/>
      <stop offset="100%" stop-color="#BDDDEC"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="600" y1="880" x2="600" y2="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8C3A5"/>
      <stop offset="35%" stop-color="#CEB88E"/>
      <stop offset="100%" stop-color="#C5AA7B"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="934" cy="288" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#EFE2CC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EFE2CC" stop-opacity="0"/>
    </radialGradient>
    <filter id="sandTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="10" flood-color="#153A5E" flood-opacity="0.12"/>
    </filter>
    <!-- Motion blur for runners -->
    <filter id="motionTrail" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6 0"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="1500" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <ellipse cx="250" cy="140" rx="190" ry="28" fill="#EFE2CC" opacity="0.22"/>
  <ellipse cx="340" cy="135" rx="100" ry="19" fill="#EFE2CC" opacity="0.18"/>
  <ellipse cx="650" cy="190" rx="160" ry="24" fill="#EFE2CC" opacity="0.15"/>
  <ellipse cx="500" cy="340" rx="130" ry="17" fill="#EFE2CC" opacity="0.1"/>

  <!-- Sun glow -->
  <circle cx="934" cy="288" r="220" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="934" cy="288" r="106" fill="#EFE2CC"/>
  <circle cx="934" cy="288" r="92" fill="#F5EBDD"/>
  <circle cx="934" cy="288" r="76" fill="#FFF8E7" opacity="0.55"/>

  <!-- Birds -->
  <g stroke="#3D78A8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.2">
    <path d="M160 310C166 303 172 303 178 310"/>
    <path d="M200 295C206 288 212 288 218 295"/>
    <path d="M185 325C191 318 197 318 203 325"/>
  </g>

  <!-- Sand base -->
  <rect y="884" width="1200" height="616" fill="url(#sandGrad)" filter="url(#sandTexture)"/>

  <!-- Deep water -->
  <path d="M0 786C172 692 319 673 463 715C595 754 717 855 871 871C996 885 1085 847 1200 769V923C1050 1001 935 1050 793 1037C630 1022 536 948 390 922C256 898 142 922 0 980V786Z" fill="url(#deepWater)"/>
  <!-- Water shimmer -->
  <path d="M0 786C172 692 319 673 463 715C595 754 717 855 871 871C996 885 1085 847 1200 769V784C1085 861 996 899 871 885C717 869 595 768 463 729C319 687 172 706 0 800V786Z" fill="#4D90C5" opacity="0.35"/>

  <!-- Shallow water -->
  <path d="M0 923C149 861 258 839 390 861C540 886 629 962 793 971C928 978 1041 929 1200 846V1071H0V923Z" fill="url(#shallowWater)"/>

  <!-- Foam -->
  <path d="M0 910C110 898 240 895 390 905C530 914 650 935 810 938C940 940 1060 930 1200 915" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M0 925C130 915 270 912 420 920C580 929 700 945 860 948C980 950 1080 940 1200 928" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Race path/trail -->
  <path d="M126 1087C243 1029 326 1011 417 1033C512 1057 568 1119 672 1130C765 1139 838 1108 948 1050" stroke="#F6EFE4" stroke-width="22" stroke-linecap="round"/>
  <path d="M126 1087C243 1029 326 1011 417 1033C512 1057 568 1119 672 1130C765 1139 838 1108 948 1050" stroke="#E8DCC8" stroke-width="14" stroke-linecap="round" opacity="0.5"/>

  <!-- Runner 1 (leading) - in motion -->
  <g filter="url(#softShadow)">
    <!-- Motion trail -->
    <path d="M310 940L343 937" stroke="#153A5E" stroke-width="3" stroke-linecap="round" opacity="0.15" filter="url(#motionTrail)"/>
    <!-- Head -->
    <circle cx="343" cy="916" r="24" fill="#153A5E"/>
    <!-- Body leaning forward -->
    <path d="M343 940L360 1000" stroke="#153A5E" stroke-width="14" stroke-linecap="round"/>
    <!-- Leading leg (extended) -->
    <path d="M360 1000L390 1055" stroke="#153A5E" stroke-width="13" stroke-linecap="round"/>
    <path d="M390 1055L405 1080" stroke="#153A5E" stroke-width="11" stroke-linecap="round"/>
    <!-- Trailing leg -->
    <path d="M360 1000L335 1050" stroke="#153A5E" stroke-width="13" stroke-linecap="round"/>
    <path d="M335 1050L315 1070" stroke="#153A5E" stroke-width="11" stroke-linecap="round"/>
    <!-- Front arm -->
    <path d="M348 955L375 930" stroke="#153A5E" stroke-width="10" stroke-linecap="round"/>
    <!-- Back arm -->
    <path d="M348 955L320 975" stroke="#153A5E" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Runner 2 -->
  <g filter="url(#softShadow)">
    <path d="M455 950L489 947" stroke="#153A5E" stroke-width="3" stroke-linecap="round" opacity="0.12" filter="url(#motionTrail)"/>
    <circle cx="489" cy="930" r="23" fill="#153A5E"/>
    <path d="M489 953L504 1010" stroke="#153A5E" stroke-width="13" stroke-linecap="round"/>
    <path d="M504 1010L530 1062" stroke="#153A5E" stroke-width="12" stroke-linecap="round"/>
    <path d="M530 1062L543 1085" stroke="#153A5E" stroke-width="10" stroke-linecap="round"/>
    <path d="M504 1010L482 1058" stroke="#153A5E" stroke-width="12" stroke-linecap="round"/>
    <path d="M482 1058L468 1078" stroke="#153A5E" stroke-width="10" stroke-linecap="round"/>
    <path d="M494 968L518 945" stroke="#153A5E" stroke-width="9" stroke-linecap="round"/>
    <path d="M494 968L470 988" stroke="#153A5E" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Runner 3 -->
  <g filter="url(#softShadow)">
    <path d="M606 960L640 958" stroke="#153A5E" stroke-width="3" stroke-linecap="round" opacity="0.12" filter="url(#motionTrail)"/>
    <circle cx="640" cy="945" r="22" fill="#153A5E"/>
    <path d="M640 967L654 1022" stroke="#153A5E" stroke-width="13" stroke-linecap="round"/>
    <path d="M654 1022L678 1072" stroke="#153A5E" stroke-width="12" stroke-linecap="round"/>
    <path d="M678 1072L690 1094" stroke="#153A5E" stroke-width="10" stroke-linecap="round"/>
    <path d="M654 1022L634 1068" stroke="#153A5E" stroke-width="12" stroke-linecap="round"/>
    <path d="M634 1068L622 1088" stroke="#153A5E" stroke-width="10" stroke-linecap="round"/>
    <path d="M645 980L668 958" stroke="#153A5E" stroke-width="9" stroke-linecap="round"/>
    <path d="M645 980L622 1000" stroke="#153A5E" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Dust/sand kick-up behind runners -->
  <g opacity="0.12">
    <circle cx="305" cy="1075" r="12" fill="#D8C3A5"/>
    <circle cx="295" cy="1065" r="8" fill="#D8C3A5"/>
    <circle cx="315" cy="1080" r="6" fill="#D8C3A5"/>
    <circle cx="455" cy="1082" r="10" fill="#D8C3A5"/>
    <circle cx="445" cy="1074" r="7" fill="#D8C3A5"/>
    <circle cx="610" cy="1092" r="9" fill="#D8C3A5"/>
    <circle cx="602" cy="1085" r="6" fill="#D8C3A5"/>
  </g>

  <!-- Finish banner posts -->
  <g filter="url(#softShadow)">
    <!-- Left post -->
    <path d="M920 920L920 1060" stroke="#14385B" stroke-width="8" stroke-linecap="round"/>
    <!-- Right post -->
    <path d="M1000 920L1000 1060" stroke="#14385B" stroke-width="8" stroke-linecap="round"/>
    <!-- Banner -->
    <rect x="920" y="920" width="80" height="30" rx="3" fill="#14385B"/>
    <rect x="920" y="920" width="80" height="30" rx="3" fill="none" stroke="#F6EFE4" stroke-width="2"/>
    <!-- Checkered pattern hint -->
    <rect x="925" y="925" width="10" height="10" fill="#F6EFE4" opacity="0.7"/>
    <rect x="945" y="925" width="10" height="10" fill="#F6EFE4" opacity="0.7"/>
    <rect x="965" y="925" width="10" height="10" fill="#F6EFE4" opacity="0.7"/>
    <rect x="985" y="925" width="10" height="10" fill="#F6EFE4" opacity="0.7"/>
    <rect x="935" y="935" width="10" height="10" fill="#F6EFE4" opacity="0.7"/>
    <rect x="955" y="935" width="10" height="10" fill="#F6EFE4" opacity="0.7"/>
    <rect x="975" y="935" width="10" height="10" fill="#F6EFE4" opacity="0.7"/>
  </g>

  <!-- Beach grass -->
  <g stroke="#8FA87A" stroke-width="3" stroke-linecap="round" opacity="0.3">
    <path d="M60 960L55 920"/>
    <path d="M60 960L68 925"/>
    <path d="M60 960L48 928"/>
    <path d="M1140 940L1135 900"/>
    <path d="M1140 940L1148 905"/>
    <path d="M1140 940L1128 908"/>
  </g>

  <!-- Foreground sand dune -->
  <path d="M142 1239C314 1193 469 1182 660 1209C824 1233 992 1282 1200 1362V1500H0V1322C53 1292 96 1268 142 1239Z" fill="#F5EBDD"/>

  <!-- Sand ripples -->
  <path d="M0 1327C167 1252 330 1230 517 1259C688 1285 863 1353 1057 1451" stroke="#C8AF8A" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  <path d="M60 1370C230 1320 430 1315 650 1330C850 1343 1040 1380 1180 1430" stroke="#DDD0B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M0 1440C200 1415 400 1410 620 1425C820 1438 1000 1460 1200 1485" stroke="#DDD0B8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Footprints in sand (race trail) -->
  <g opacity="0.12">
    <ellipse cx="200" cy="1250" rx="8" ry="12" fill="#153A5E" transform="rotate(-5 200 1250)"/>
    <ellipse cx="225" cy="1255" rx="8" ry="12" fill="#153A5E" transform="rotate(5 225 1255)"/>
    <ellipse cx="250" cy="1245" rx="8" ry="12" fill="#153A5E" transform="rotate(-3 250 1245)"/>
    <ellipse cx="278" cy="1252" rx="8" ry="12" fill="#153A5E" transform="rotate(4 278 1252)"/>
  </g>
</svg>
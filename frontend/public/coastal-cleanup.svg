<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="600" y1="0" x2="600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8DCC8"/>
      <stop offset="60%" stop-color="#F5EEDF"/>
      <stop offset="100%" stop-color="#FAEBD7"/>
    </linearGradient>
    <linearGradient id="deepWater" x1="600" y1="650" x2="600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B5F8A"/>
      <stop offset="100%" stop-color="#3B74A3"/>
    </linearGradient>
    <linearGradient id="shallowWater" x1="600" y1="780" x2="600" y2="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7BA7CA"/>
      <stop offset="70%" stop-color="#9FC5DD"/>
      <stop offset="100%" stop-color="#B8D8EA"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="600" y1="920" x2="600" y2="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6BF9D"/>
      <stop offset="40%" stop-color="#CCAF87"/>
      <stop offset="100%" stop-color="#C4A478"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="225" cy="282" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#EFE2CC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EFE2CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bagGrad" x1="860" y1="1016" x2="980" y2="1300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5EBDD"/>
      <stop offset="100%" stop-color="#E8D9C0"/>
    </linearGradient>
    <!-- Foam texture -->
    <filter id="foam" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="threshNoise">
        <feFuncA type="discrete" tableValues="0 0 0 0 0 0 1 1"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="threshNoise" operator="in"/>
    </filter>
    <!-- Sand texture -->
    <filter id="sandTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#153A5E" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="1500" fill="url(#skyGrad)"/>

  <!-- Subtle cloud wisps -->
  <ellipse cx="380" cy="180" rx="200" ry="30" fill="#EFE2CC" opacity="0.3"/>
  <ellipse cx="440" cy="175" rx="120" ry="22" fill="#EFE2CC" opacity="0.25"/>
  <ellipse cx="820" cy="140" rx="160" ry="25" fill="#EFE2CC" opacity="0.2"/>
  <ellipse cx="900" cy="135" rx="90" ry="18" fill="#EFE2CC" opacity="0.15"/>
  <ellipse cx="150" cy="380" rx="140" ry="20" fill="#EFE2CC" opacity="0.15"/>

  <!-- Sun glow -->
  <circle cx="225" cy="282" r="180" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="225" cy="282" r="88" fill="#EFE2CC"/>
  <circle cx="225" cy="282" r="78" fill="#F5EBDD"/>
  <circle cx="225" cy="282" r="65" fill="#FFF8E7" opacity="0.6"/>

  <!-- Sand base -->
  <rect y="929" width="1200" height="571" fill="url(#sandGrad)" filter="url(#sandTexture)"/>

  <!-- Deep water -->
  <path d="M0 684C169 623 333 616 492 658C647 699 785 798 955 811C1047 818 1129 799 1200 768V901C1117 939 1033 958 935 953C773 944 641 856 491 822C328 785 160 799 0 871V684Z" fill="url(#deepWater)"/>
  <!-- Water highlights -->
  <path d="M0 684C169 623 333 616 492 658C647 699 785 798 955 811C1047 818 1129 799 1200 768V780C1129 810 1047 830 955 823C785 810 647 711 492 670C333 628 169 635 0 696V684Z" fill="#4A8BBF" opacity="0.4"/>

  <!-- Shallow water -->
  <path d="M0 788C162 720 327 709 491 748C640 783 771 872 935 883C1032 889 1115 867 1200 827V1028H0V788Z" fill="url(#shallowWater)"/>

  <!-- Foam line along shore -->
  <path d="M0 940C80 925 180 918 280 928C400 940 480 965 600 970C720 975 830 960 950 940C1050 925 1130 935 1200 950" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <path d="M0 955C100 940 200 935 320 945C440 955 520 975 650 978C770 980 870 965 1000 948C1100 935 1160 942 1200 955" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Seaweed/debris in water -->
  <ellipse cx="180" cy="880" rx="18" ry="6" fill="#2B5F8A" opacity="0.3"/>
  <ellipse cx="680" cy="850" rx="14" ry="5" fill="#2B5F8A" opacity="0.25"/>
  <ellipse cx="1050" cy="870" rx="12" ry="4" fill="#2B5F8A" opacity="0.2"/>

  <!-- Main figure - person with driftwood/cleanup stick -->
  <g filter="url(#softShadow)">
    <!-- Head -->
    <circle cx="490" cy="890" r="48" fill="#153A5E"/>
    <!-- Shoulders/body arc -->
    <path d="M440 930C440 930 455 960 490 970C525 960 540 930 540 930" stroke="#153A5E" stroke-width="22" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <path d="M490 970L490 1060" stroke="#153A5E" stroke-width="22" stroke-linecap="round"/>
    <!-- Arm reaching down with grabber -->
    <path d="M470 985L395 1070" stroke="#153A5E" stroke-width="16" stroke-linecap="round"/>
    <!-- Other arm holding bag -->
    <path d="M510 985L590 1050" stroke="#153A5E" stroke-width="16" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M490 1060L445 1190" stroke="#153A5E" stroke-width="18" stroke-linecap="round"/>
    <path d="M490 1060L540 1185" stroke="#153A5E" stroke-width="18" stroke-linecap="round"/>
    <!-- Grabber tool -->
    <path d="M395 1070L360 1140" stroke="#153A5E" stroke-width="8" stroke-linecap="round"/>
    <path d="M350 1145L370 1135" stroke="#153A5E" stroke-width="6" stroke-linecap="round"/>
    <path d="M350 1145L368 1152" stroke="#153A5E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Trash bag -->
  <g filter="url(#softShadow)">
    <path d="M580 1020C590 990 630 975 665 985C700 995 720 1030 715 1065L695 1170C690 1200 660 1220 630 1215L595 1205C565 1198 545 1170 550 1140L580 1020Z" fill="url(#bagGrad)" stroke="#153A5E" stroke-width="10"/>
    <!-- Bag tie -->
    <path d="M590 1005C610 990 640 988 660 1000" stroke="#153A5E" stroke-width="8" stroke-linecap="round"/>
    <!-- Bag texture lines -->
    <path d="M600 1050L660 1065" stroke="#153A5E" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M595 1100L655 1110" stroke="#153A5E" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    <path d="M598 1150L648 1158" stroke="#153A5E" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- Clipboard / sign on sand -->
  <g filter="url(#softShadow)">
    <path d="M830 1030L970 1000L1060 1250L925 1275L830 1030Z" fill="url(#bagGrad)" stroke="#153A5E" stroke-width="12" stroke-linejoin="round"/>
    <!-- Clipboard clip -->
    <rect x="880" y="995" width="60" height="18" rx="6" fill="#153A5E"/>
    <!-- Text lines -->
    <path d="M875 1075L975 1050" stroke="#153A5E" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <path d="M885 1115L980 1092" stroke="#153A5E" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <path d="M895 1155L965 1138" stroke="#153A5E" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <!-- Checkmarks -->
    <path d="M860 1070L867 1080L880 1065" stroke="#3B74A3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M870 1110L877 1120L890 1105" stroke="#3B74A3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Scattered debris on sand (to be cleaned) -->
  <!-- Bottle -->
  <g opacity="0.6">
    <rect x="250" y="1100" width="16" height="35" rx="5" fill="#9FC5DD" stroke="#153A5E" stroke-width="3" transform="rotate(-15 258 1117)"/>
    <rect x="254" y="1092" width="8" height="12" rx="3" fill="#9FC5DD" stroke="#153A5E" stroke-width="2" transform="rotate(-15 258 1098)"/>
  </g>
  <!-- Can -->
  <g opacity="0.5">
    <rect x="760" y="1150" width="22" height="30" rx="6" fill="#C4A478" stroke="#153A5E" stroke-width="3" transform="rotate(10 771 1165)"/>
  </g>
  <!-- Small debris -->
  <circle cx="350" cy="1180" r="6" fill="#153A5E" opacity="0.25"/>
  <circle cx="680" cy="1130" r="5" fill="#153A5E" opacity="0.2"/>
  <circle cx="1100" cy="1120" r="7" fill="#153A5E" opacity="0.2"/>

  <!-- Foreground sand dune -->
  <path d="M212 1297C370 1248 527 1237 706 1264C858 1287 1017 1336 1200 1408V1500H0V1385C56 1359 122 1331 212 1297Z" fill="#F5EBDD"/>
  <!-- Sand ripple details -->
  <path d="M100 1380C250 1350 400 1345 580 1360C740 1373 900 1400 1100 1440" stroke="#DDD0B8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M0 1430C200 1405 400 1400 620 1415C820 1428 1000 1455 1200 1480" stroke="#DDD0B8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Small footprints in sand -->
  <g opacity="0.15">
    <ellipse cx="300" cy="1310" rx="10" ry="15" fill="#153A5E" transform="rotate(-10 300 1310)"/>
    <ellipse cx="325" cy="1318" rx="10" ry="15" fill="#153A5E" transform="rotate(5 325 1318)"/>
    <ellipse cx="348" cy="1305" rx="10" ry="15" fill="#153A5E" transform="rotate(-8 348 1305)"/>
    <ellipse cx="375" cy="1315" rx="10" ry="15" fill="#153A5E" transform="rotate(3 375 1315)"/>
  </g>
</svg>
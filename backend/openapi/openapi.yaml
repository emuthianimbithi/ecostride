  /public/volunteers:
    post:
      summary: Volunteer signup
      tags: [Public Volunteers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Created }
  /public/shop/products:
    get:
      summary: List products
      tags: [Public Shop]
      responses:
        "200": { description: OK }
  /public/shop/orders:
    post:
      summary: Create or replay a shop or support order
      description: Prices and custom-amount permissions are checked by the server. Stock is reserved transactionally for 30 minutes. Repeat the same key and body to recover an uncertain response. Returns only the order reference, status, total, currency and reservation expiry.
      tags: [Public Shop]
      parameters:
        - { in: header, name: X-Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer_name, email, currency, items]
              properties:
                buyer_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                currency: { type: string, enum: [KES, USD, EUR] }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [product_slug, qty]
                    properties:
                      product_slug: { type: string, format: uuid }
                      qty: { type: integer, minimum: 1, maximum: 100 }
                      custom_amount_minor: { type: integer, minimum: 1, description: Only accepted for products allowing a custom amount }
                      meta: { type: object }
      responses:
        "201": { description: New or matching existing order }
        "400": { description: Missing key or invalid price, item or quantity }
        "409": { description: Key mismatch, stock unavailable or price changed }
  /public/shop/orders/{id}/pay/stripe:
    post:
      summary: Pay order with Stripe
      tags: [Public Shop]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /public/shop/orders/{id}/pay/mpesa:
    post:
      summary: Pay order with M-Pesa
      tags: [Public Shop]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /admin/pages:

  /admin/registrations/{id}/resend-receipt:
    post:
      summary: Resend registration receipt
      description: Requires payment.receipt.resend. Uses the payment resend workflow with the saved recipient, pending-job deduplication and transactional audit.
      tags: [Admin Registrations]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "202": { description: Queued or existing pending delivery reused }
        "400": { description: Reason required }
        "403": { description: Missing permission }
        "404": { description: Payment or receipt not found }
  /admin/payments:
    get:
      summary: List payments
      tags: [Admin Payments]
      parameters:
        - in: query
          name: needs_review
          schema: { type: boolean }
          description: Include payments flagged for review or pending more than 15 minutes

      responses:
        "200": { description: OK }
  /admin/payments/{id}:
    get:
      summary: Get payment and receipt delivery history
      description: Requires payment.read. Returns up to 50 notification and 50 receipt job summaries; excludes raw payloads, request metadata and worker errors. Review flags are operational signals, not verified provider status.
      tags: [Admin Payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Payment, review flags, receipt and delivery history }
        "401": { description: Authentication required }
        "403": { description: Missing permission }
        "404": { description: Payment not found }
  /admin/payments/{id}/verify:
    post:
      summary: Verify a saved PesaPal tracking ID with the provider
      description: Requires payment.verify and an audit reason. Successful verification, receipt jobs and audit commit together. Does not create a new charge.
      tags: [Admin Payments]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Verified local payment status }
        "403": { description: Missing permission }
        "409": { description: Missing tracking ID or unsupported provider }
        "502": { description: Provider verification failed; current local status retained }
  /admin/payments/{id}/resend-receipt:
    post:
      summary: Queue delivery of an existing receipt
      description: Requires payment.receipt.resend. Uses the receipt's saved recipient. Concurrent requests reuse pending email delivery. Queueing and audit commit together. Limited to five requests per minute per IP per API process.
      tags: [Admin Payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "202": { description: Queued or existing pending delivery reused }
        "400": { description: Invalid reason }
        "401": { description: Authentication required }
        "403": { description: Missing permission }
        "404": { description: Payment or existing receipt not found }
        "409": { description: Payment is not successful or refunded }
        "429": { description: Too many requests }
  /admin/payments/{id}/refund:
    post:
      summary: Refund payment
      description: Requires payment.refund. Only full refunds are supported; partial amounts are rejected until cumulative refund accounting is implemented.
      tags: [Admin Payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /admin/orders/{id}/collect:
    post:
      summary: Record merchandise collection once
      description: Requires shop.fulfill. Requires a paid order with matching successful payment and merchandise items. Collection timestamp, actor and audit commit together; retries preserve the original record. No partial collection is supported.
      tags: [Admin Shop]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Original or newly recorded collection timestamp }
        "403": { description: Missing permission }
        "404": { description: Order not found }
        "409": { description: Order is not eligible for merchandise collection }
  /admin/finance/dashboard:
    get:
      summary: Finance dashboard
      tags: [Admin Finance]
      responses:
        "200": { description: OK }
  /admin/finance/export:
    get:
      summary: Finance export
      tags: [Admin Finance]
      responses:
        "200": { description: OK }
  /admin/reconciliation/import:

openapi: 3.0.3
info:
  title: EcoStride API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /me:
    get:
      summary: Current user profile
      tags: [Auth]
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /public/pages/{slug}:
    get:
      summary: Get published page
      tags: [Public CMS]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not Found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /public/posts:
    get:
      summary: List published posts
      tags: [Public CMS]
      responses:
        "200": { description: OK }
  /public/posts/{slug}:
    get:
      summary: Get published post
      tags: [Public CMS]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not Found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /public/gallery/albums:
    get:
      summary: List gallery albums
      tags: [Public CMS]
      responses:
        "200": { description: OK }
  /public/gallery/albums/{slug}:
    get:
      summary: Get gallery album
      tags: [Public CMS]
      parameters:
        - in: path
          name: slug

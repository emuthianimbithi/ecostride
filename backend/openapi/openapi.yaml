  /public/sponsors:
    get:
      summary: List sponsors
      tags: [Public Sponsors]
      responses:
        "200": { description: OK }
  /public/sponsors/{slug}/view:
    post:
      summary: Record sponsor view
      tags: [Public Sponsors]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: string }
      responses:
        "200": { description: OK }
  /public/events:
    get:
      summary: List events
      tags: [Public Events]
      responses:
        "200": { description: OK }
  /public/events/{slug}:
    get:
      summary: Get event
      tags: [Public Events]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not Found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /public/events/{slug}/categories:
    get:
      summary: List event categories
      tags: [Public Events]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /public/events/{slug}/waiver/current:
    get:
      summary: Get current waiver
      tags: [Public Events]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /public/registrations:
    post:
      summary: Create registration with explicit versioned waiver acceptance
      description: Existing entries return a conflict without disclosing participant data. Select a category when the event has categories. Deploy callers with this contract before accepting registrations.
      tags: [Public Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_slug, athlete_name, email, phone, waiver_accepted, waiver_slug]
              properties:
                event_slug: { type: string }
                category_slug: { type: string, format: uuid }
                athlete_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                waiver_accepted: { type: boolean, enum: [true] }
                waiver_slug: { type: string, format: uuid, description: Slug returned by the current waiver endpoint }
      responses:
        "201":
          description: Created; only registration reference and status are returned
          content:
            application/json:
              schema:
                type: object
                required: [slug, status]
                properties:
                  slug: { type: string, format: uuid }
                  status: { type: string, enum: [pending_payment, confirmed] }
        "409": { description: Existing registration or stale waiver; no existing participant data returned }
        "400": { description: Invalid request or waiver acceptance missing }
  /public/registrations/{id}:
    get:
      summary: Get registration
      tags: [Public Registration]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not Found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /public/registrations/{id}/confirmation.pdf:
    get:
      summary: Download confirmation PDF
      tags: [Public Registration]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /public/payments/providers:
    get:
      summary: Read PesaPal checkout availability
      responses:
        "200": { description: pesapal_enabled boolean, without merchant configuration }
  /public/payments/pesapal/checkout:
    post:
      summary: Create or reuse a PesaPal hosted checkout
      description: KES only. Supply exactly one target. Repeated matching keys reuse the saved attempt. Uncertain submission outcomes remain pending and are never submitted again automatically.
      tags: [Public Payments]
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_slug: { type: string, format: uuid }
                order_slug: { type: string, format: uuid }
                currency: { type: string, enum: [KES] }
      responses:
        "200": { description: Saved payment_id, status and checkout_url }
        "202": { description: Pending attempt without confirmed redirect; display local payment status }
        "400": { description: Invalid target, currency or key }
        "409": { description: Key conflict or existing pending or settled payment }
        "503": { description: PesaPal disabled }
  /public/payments/pesapal/callback:
    get:
      summary: Verify a PesaPal browser return and redirect to configured payment page
      parameters:
        - { in: query, name: OrderTrackingId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: OrderMerchantReference, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: OrderNotificationType, required: false, description: May be omitted by the hosted browser return. Payment status is always verified with PesaPal., schema: { type: string, enum: [CALLBACKURL] } }
      responses:
        "303": { description: Redirect to configured frontend payment page; payment can still be pending }
        "400": { description: Invalid notification }
        "404": { description: Unknown payment }
  /webhooks/pesapal:
    get:
      summary: Receive PesaPal GET IPN and verify server-side status
      parameters:
        - { in: query, name: OrderTrackingId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: OrderMerchantReference, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: OrderNotificationType, required: true, schema: { type: string, enum: [IPNCHANGE] } }
      responses:
        "200": { description: Acknowledged verified notification with provider acknowledgment fields }
        "500": { description: Verification or processing failed; safe for provider retry }
    post:
      summary: Receive PesaPal JSON IPN (maximum 4096 bytes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [OrderTrackingId, OrderMerchantReference, OrderNotificationType]
              properties:
                OrderTrackingId: { type: string, format: uuid }
                OrderMerchantReference: { type: string, format: uuid }
                OrderNotificationType: { type: string, enum: [IPNCHANGE] }
      responses:
        "200": { description: Verified status processed or duplicate acknowledged }
        "400": { description: Invalid notification }
        "500": { description: Verification or processing failed; safe for provider retry }
  /public/payments/stripe/checkout:
    post:
      summary: Create Stripe checkout session
      description: A matching key reuses the saved attempt. Changed requests or another pending/settled attempt return 409. A submission with unknown outcome stays pending and must be reconciled before a new charge.
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      tags: [Public Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Created or replayed attempt }
        "202": { description: Existing attempt has no provider result yet; poll payment status, do not resubmit }
        "400": { description: Missing idempotency key or invalid target }
        "409": { description: Key/request mismatch or another attempt is pending or settled }
  /webhooks/stripe:
    post:
      summary: Stripe webhook
      tags: [Webhooks]
      responses:
        "200": { description: OK }
  /public/payments/mpesa/stk:
    post:
      summary: Initiate M-Pesa STK push
      description: A matching key reuses the saved attempt. Changed requests or another pending/settled attempt return 409. A submission with unknown outcome stays pending and must be reconciled before a new charge.
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      tags: [Public Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Created or replayed attempt }
        "202": { description: Existing attempt has no provider result yet; poll payment status, do not resubmit }
        "400": { description: Missing idempotency key or invalid target }
        "409": { description: Key/request mismatch or another attempt is pending or settled }
  /webhooks/mpesa:
    post:
      summary: M-Pesa webhook
      tags: [Webhooks]
      responses:
        "200": { description: OK }
  /public/payments/{id}/status:

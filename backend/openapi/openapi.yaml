      responses:
        "200": { description: OK }
    put:
      summary: Update registration contact and race details
      description: Requires registration.write. Status edits are rejected with 409; payment state is provider-verified and cancellation uses its dedicated endpoint.
      tags: [Admin Registrations]
      parameters:
        - in: path
          name: id

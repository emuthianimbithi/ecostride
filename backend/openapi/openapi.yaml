  /admin/events/{id}/bibs/auto-assign:
    post:
      summary: Auto-assign bibs
      description: Requires bib.assign.auto. Only paid or confirmed entries with free categories or a saved successful payment are eligible; allocation is serialized per event.
      tags: [Admin Bibs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /admin/events/{id}/bibs/manual-assign:
    post:
      summary: Manual assign bib
      description: Requires bib.assign.manual. Entry must be eligible with an available positive number inside its configured category range. Identical replay reuses the assignment; replacement is rejected. Serialized with automatic allocation and audited transactionally.
      tags: [Admin Bibs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_slug, bib_number]
              properties:
                registration_slug: { type: string, format: uuid }
                bib_number: { type: integer, minimum: 1 }
      responses:
        "201": { description: Assigned }
        "200": { description: Identical existing assignment reused }
        "409": { description: Ineligible entry, invalid range, occupied number or existing different assignment }
        "404": { description: Event, registration or category not found }
  /admin/events/{id}/bibs/lock:
    post:
      summary: Lock bibs
      description: Requires bib.assign.manual. Looks up the assignment within the route event, preserves the first lock timestamp on replay and audits the lock transactionally.
      tags: [Admin Bibs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /admin/events/{id}/start-list/export:
    get:
      summary: Export start list
      tags: [Admin Bibs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /admin/race-day/events:
    get:
      summary: List minimal event information for race desk staff
      description: Requires checkin.access, bib.assign.auto or bib.assign.manual. Excludes private event configuration.
      tags: [Admin Bibs]
      responses:
        "200": { description: Event identifiers, titles, type, location and date }
        "403": { description: Missing race desk permission }
  /admin/race-day/events/{id}/entries:
    get:
      summary: Find race desk entries
      description: Requires checkin.access, bib.assign.auto or bib.assign.manual. Returns at most 100 matching entries in this event, with reference, name, category, eligibility, bib and collection timestamps. Excludes contact, medical and financial details. Search is a literal substring except exact bib matching.
      tags: [Admin Bibs]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Matching race desk entries }
        "400": { description: Invalid identifier or search }
        "403": { description: Missing permission }
        "404": { description: Event not found }

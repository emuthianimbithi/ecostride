components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Invalid request data"
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: "snake_case field name"
                    example: "email_address"
                  issue:
                    type: string
                    example: "must be a valid email"
    
    HeroStyle:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        description:
          type: string
        layout_type:
          type: string
        aspect_ratio:
          type: string
        text_placement:
          type: string
        padding_variant:
          type: string
        is_active:
          type: boolean
        overlay:
          type: object

    Post:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
          format: uuid
        url_slug:
          type: string
        title:
          type: string
        content:
          type: object
        excerpt:
          type: string
        featured_image_media_id:
          type: integer
        featured_image_url:
          type: string
        hero_style_id:
          type: string
        hero_style:
          $ref: "#/components/schemas/HeroStyle"
        hero_show_title:
          type: boolean
        status:
          type: string
        published_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
